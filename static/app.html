<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Libro delle Storie</title>
<style>
  :root{
    --leather:#3b1f12; --leather-2:#26130b; --gold:#c9a24b; --gold-d:#8a6a22;
    --paper:#f1e3c2; --paper-2:#e6d3a8; --ink:#2b1a0e; --ink-soft:#5a4129;
    --wax:#8b1a1a; --wax-l:#b3302b;
    --serif:"Palatino Linotype","Book Antiqua",Palatino,"Hoefler Text","Iowan Old Style","Garamond",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:var(--serif); color:var(--ink);
    background:
      radial-gradient(ellipse at 50% 0%,#5a3420 0%,transparent 60%),
      repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 2px,transparent 2px 6px),
      var(--leather-2);
    padding:2.5rem 1rem 3rem;
  }
  h1.cover-title{
    text-align:center; margin:0 0 1.6rem; color:var(--gold);
    font-weight:normal; font-variant:small-caps; letter-spacing:.18em;
    font-size:clamp(1.6rem,4vw,2.6rem); text-shadow:0 2px 0 #000a;
  }
  h1.cover-title small{display:block;font-size:.4em;letter-spacing:.4em;color:var(--gold-d);margin-top:.4rem}

  .book{
    max-width:1180px; margin:0 auto; position:relative;
    background:linear-gradient(var(--leather),var(--leather-2));
    padding:18px; border-radius:14px;
    box-shadow:0 30px 60px #000a, inset 0 0 0 2px var(--gold-d), inset 0 0 0 6px var(--leather), inset 0 0 0 7px var(--gold-d);
  }
  .spread{
    display:grid; grid-template-columns:1fr 1fr; position:relative;
    border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 1px #0006;
  }
  .spread::after{ /* rilegatura */
    content:""; position:absolute; top:0; bottom:0; left:50%; width:70px; transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,rgba(60,30,10,.35) 45%,rgba(40,20,5,.55) 50%,rgba(60,30,10,.35) 55%,transparent);
    pointer-events:none; z-index:2;
  }
  .page{
    position:relative; padding:2.2rem 2.6rem 2.4rem; min-height:640px;
    background:
      radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
      radial-gradient(ellipse at 100% 100%,rgba(120,80,30,.28),transparent 55%),
      var(--paper);
  }
  .page.left{ box-shadow:inset -30px 0 40px -30px rgba(70,40,10,.45); }
  .page.right{ box-shadow:inset 30px 0 40px -30px rgba(70,40,10,.45); }
  .page::before{ /* bordo interno */
    content:""; position:absolute; inset:14px; border:1px solid rgba(138,106,34,.45); pointer-events:none;
  }
  .page-no{position:absolute;bottom:.7rem;left:0;right:0;text-align:center;font-size:.8rem;color:var(--ink-soft);font-style:italic}

  h2{
    font-weight:normal; text-align:center; margin:0 0 .2rem; font-size:1.55rem;
    font-variant:small-caps; letter-spacing:.1em;
  }
  .ornament{ text-align:center; color:var(--gold-d); letter-spacing:.5em; margin:.2rem 0 1.1rem; user-select:none }
  label.lbl{display:block;font-variant:small-caps;letter-spacing:.12em;font-size:1.02rem;margin:1.1rem 0 .4rem;color:var(--ink)}
  label.lbl em{font-style:italic;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink-soft)}

  select, textarea, input[type=text]{
    width:100%; font:inherit; font-size:1.02rem; color:var(--ink);
    background:rgba(255,248,228,.65); border:1px solid var(--gold-d); border-radius:3px;
    padding:.55rem .7rem; outline:none;
    box-shadow:inset 0 1px 3px rgba(80,50,10,.25);
  }
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:2rem;cursor:pointer}
  select:focus,textarea:focus,input[type=text]:focus{border-color:var(--wax);box-shadow:0 0 0 2px rgba(139,26,26,.2)}
  textarea{resize:vertical;min-height:84px}
  #customTheme{margin-top:.5rem;display:none}

  .chars{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.6rem;
    max-height:300px; overflow-y:auto; padding:.4rem .3rem .6rem; margin:0 -.3rem;
    scrollbar-width:thin; scrollbar-color:var(--gold-d) transparent;
  }
  .char{
    position:relative; text-align:left; font:inherit; color:inherit; cursor:pointer;
    background:rgba(255,248,228,.55); border:1px solid rgba(138,106,34,.6); border-radius:4px;
    padding:.55rem .65rem .6rem; transition:transform .15s, box-shadow .15s, background .15s;
  }
  .char:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(60,30,10,.25)}
  .char:focus-visible{outline:2px solid var(--wax);outline-offset:2px}
  .char .n{display:block;font-weight:bold;font-size:1rem;padding-right:1.4rem}
  .char .d{display:block;font-size:.82rem;font-style:italic;color:var(--ink-soft);margin-top:.2rem;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .char .seal{
    position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--wax-l),var(--wax) 70%);
    color:#f6dcc0;font-size:.8rem;display:grid;place-items:center;
    box-shadow:0 2px 4px #0006; transform:scale(0); transition:transform .18s cubic-bezier(.3,1.6,.5,1);
  }
  .char[aria-pressed=true]{background:rgba(230,200,140,.7);border-color:var(--wax);box-shadow:inset 0 0 0 1px var(--wax)}
  .char[aria-pressed=true] .seal{transform:scale(1)}
  .count{font-size:.85rem;font-style:italic;color:var(--ink-soft);text-align:right;margin-top:.2rem}

  .actions{margin-top:1.2rem;text-align:center}
  button.write{
    font:inherit;font-variant:small-caps;letter-spacing:.14em;font-size:1.1rem;cursor:pointer;
    color:#f6dcc0;border:1px solid #3a0c0c;border-radius:4px;padding:.7rem 1.8rem;
    background:linear-gradient(var(--wax-l),var(--wax));
    box-shadow:0 3px 0 #4a0f0f,0 6px 10px #0004;transition:transform .1s,box-shadow .1s,filter .15s;
  }
  button.write:hover:not(:disabled){filter:brightness(1.1)}
  button.write:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #4a0f0f}
  button.write:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:.8rem;text-align:center;font-style:italic;color:var(--wax);min-height:1.3em;font-size:.95rem}

  /* pagina destra */
  .story{max-height:560px;overflow-y:auto;padding:0 .6rem 1rem 0;scrollbar-width:thin;scrollbar-color:var(--gold-d) transparent}
  .story h3{font-weight:normal;font-size:1.7rem;text-align:center;margin:.2rem 0 0;font-variant:small-caps;letter-spacing:.06em;line-height:1.25}
  .story p{margin:0 0 .9rem;line-height:1.7;font-size:1.06rem;text-align:justify;hyphens:auto}
  .story p:first-of-type::first-letter{
    float:left;font-size:3.6rem;line-height:.85;padding:.28rem .5rem 0 0;color:var(--wax);font-weight:bold;
    text-shadow:1px 1px 0 var(--gold);
  }
  .story-actions{text-align:center;margin-top:.4rem}
  .story-actions button{font:inherit;font-size:.9rem;font-style:italic;background:none;border:none;color:var(--ink-soft);cursor:pointer;text-decoration:underline;margin:0 .6rem}
  .story-actions button:hover{color:var(--wax)}
  .empty{display:grid;place-items:center;text-align:center;min-height:430px;color:var(--ink-soft);font-style:italic;font-size:1.15rem;line-height:1.7;padding:0 1rem}
  .empty .big{font-size:3rem;color:var(--gold-d);font-style:normal;display:block;margin-bottom:.5rem}

  .ink{display:inline-flex;gap:.35rem;margin-top:.8rem}
  .ink i{width:9px;height:9px;border-radius:50%;background:var(--ink);animation:blot 1.2s infinite ease-in-out}
  .ink i:nth-child(2){animation-delay:.2s}.ink i:nth-child(3){animation-delay:.4s}
  @keyframes blot{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
  .reveal{animation:reveal .9s ease both}
  @keyframes reveal{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}

  @media (max-width:860px){
    .spread{grid-template-columns:1fr}
    .spread::after{display:none}
    .page{min-height:0;padding:2rem 1.5rem 2.4rem}
    .page.left{box-shadow:none;border-bottom:3px double var(--gold-d)}
    .page.right{box-shadow:none}
    .story{max-height:none}
    .empty{min-height:220px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1 class="cover-title">Il Libro delle Storie<small>Cronache scritte dall'inchiostro dell'intelligenza</small></h1>

<main class="book">
  <div class="spread">

    <!-- Pagina sinistra: scelte -->
    <section class="page left">
      <h2>Componi la tua storia</h2>
      <div class="ornament">❦ ❦ ❦</div>

      <form id="form" novalidate>
        <label class="lbl" for="theme">Il tema del racconto</label>
        <select id="theme" required>
          <option value="" disabled selected>— Scegli un tema —</option>
          <optgroup label="Avventura e fantasia">
            <option>Avventura in terre lontane</option>
            <option>Fantasy epico</option>
            <option>Cavalieri e draghi</option>
            <option>Magia e incantesimi</option>
            <option>Scuola di magia</option>
            <option>Pirati e tesori nascosti</option>
            <option>Mitologia e leggende antiche</option>
            <option>Viaggio nel tempo</option>
          </optgroup>
          <optgroup label="Mistero e suspense">
            <option>Giallo classico</option>
            <option>Detective noir</option>
            <option>Horror gotico</option>
            <option>Casa stregata</option>
            <option>Spionaggio internazionale</option>
            <option>Thriller psicologico</option>
          </optgroup>
          <optgroup label="Futuro e scienza">
            <option>Fantascienza spaziale</option>
            <option>Cyberpunk</option>
            <option>Steampunk</option>
            <option>Post-apocalittico</option>
            <option>Intelligenza artificiale e robot</option>
          </optgroup>
          <optgroup label="Emozioni e vita">
            <option>Storia d'amore</option>
            <option>Amicizia</option>
            <option>Storia di famiglia</option>
            <option>Romanzo di formazione</option>
            <option>Commedia degli equivoci</option>
            <option>Dramma storico</option>
          </optgroup>
          <optgroup label="Per i più piccoli">
            <option>Fiaba della buonanotte</option>
            <option>Favola con animali parlanti</option>
            <option>Supereroi</option>
          </optgroup>
          <optgroup label="Altri mondi">
            <option>Western</option>
            <option>Sopravvivenza nella natura</option>
            <option>Esplorazione dei mari</option>
            <option>Giungla misteriosa</option>
          </optgroup>
          <option value="__custom">✎ Tema personalizzato…</option>
        </select>
        <input type="text" id="customTheme" placeholder="Scrivi il tuo tema…" maxlength="120" aria-label="Tema personalizzato">

        <label class="lbl">I personaggi <em>(uno o più)</em></label>
        <div id="chars" class="chars" role="group" aria-label="Personaggi">
          <div class="count" style="grid-column:1/-1">Sto sfogliando il registro dei personaggi…</div>
        </div>
        <div class="count" id="count">Nessun personaggio scelto</div>

        <label class="lbl" for="details">Dettagli <em>(facoltativi)</em></label>
        <textarea id="details" placeholder="Ambientazione, epoca, tono, un evento da inserire…"></textarea>

        <div class="actions">
          <button type="submit" class="write" id="go">Scrivi la storia</button>
        </div>
        <div class="msg" id="msg" role="alert"></div>
      </form>
      <div class="page-no">— i —</div>
    </section>

    <!-- Pagina destra: racconto -->
    <section class="page right" aria-live="polite">
      <div id="out">
        <div class="empty"><div><span class="big">❧</span>Le pagine di questo libro sono ancora bianche.<br>Scegli un tema e i personaggi,<br>e la penna comincerà a scrivere.</div></div>
      </div>
      <div class="page-no">— ii —</div>
    </section>

  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const themeEl = $('theme'), customEl = $('customTheme'), charsEl = $('chars'),
        countEl = $('count'), detailsEl = $('details'), msgEl = $('msg'),
        goEl = $('go'), outEl = $('out'), form = $('form');
  const selected = new Set();
  let lastStory = null;

  themeEl.addEventListener('change', () => {
    const c = themeEl.value === '__custom';
    customEl.style.display = c ? 'block' : 'none';
    if (c) customEl.focus();
  });

  function updateCount() {
    const n = selected.size;
    countEl.textContent = n === 0 ? 'Nessun personaggio scelto'
      : n === 1 ? '1 personaggio scelto' : n + ' personaggi scelti';
  }

  function renderChars(list) {
    charsEl.replaceChildren();
    if (!list.length) {
      const d = document.createElement('div');
      d.className = 'count'; d.style.gridColumn = '1/-1';
      d.textContent = 'Nessun personaggio disponibile.';
      charsEl.append(d); return;
    }
    for (const c of list) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'char'; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="seal" aria-hidden="true">✓</span><span class="n"></span><span class="d"></span>';
      b.querySelector('.n').textContent = c.name;
      b.querySelector('.d').textContent = c.description;
      b.title = c.description;
      b.addEventListener('click', () => {
        const on = !selected.has(c.id);
        on ? selected.add(c.id) : selected.delete(c.id);
        b.setAttribute('aria-pressed', String(on));
        updateCount();
      });
      charsEl.append(b);
    }
  }

  async function loadChars() {
    try {
      const r = await fetch('/api/characters');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      renderChars(data.characters || []);
    } catch (e) {
      charsEl.replaceChildren();
      const d = document.createElement('div');
      d.className = 'count'; d.style.gridColumn = '1/-1'; d.style.color = 'var(--wax)';
      d.textContent = 'Impossibile caricare i personaggi. ';
      const a = document.createElement('a');
      a.href = '#'; a.textContent = 'Riprova'; a.style.color = 'var(--wax)';
      a.onclick = ev => { ev.preventDefault(); loadChars(); };
      d.append(a); charsEl.append(d);
    }
  }

  function errText(data, status) {
    if (data && Array.isArray(data.detail) && data.detail.length)
      return data.detail.map(d => d.msg).join('; ');
    if (data && typeof data.detail === 'string') return data.detail;
    return 'Il server ha risposto con errore ' + status + '.';
  }

  function showStory(s) {
    lastStory = s;
    outEl.replaceChildren();
    const wrap = document.createElement('div'); wrap.className = 'reveal';
    const h = document.createElement('h3'); h.textContent = s.title;
    const o = document.createElement('div'); o.className = 'ornament'; o.textContent = '❦';
    const box = document.createElement('div'); box.className = 'story';
    s.content.split(/\n+/).map(t => t.trim()).filter(Boolean).forEach(t => {
      const p = document.createElement('p'); p.textContent = t; box.append(p);
    });
    const act = document.createElement('div'); act.className = 'story-actions';
    const cp = document.createElement('button'); cp.type = 'button'; cp.textContent = 'Copia il testo';
    cp.onclick = async () => {
      try { await navigator.clipboard.writeText(s.title + '\n\n' + s.content); cp.textContent = 'Copiato ✓'; }
      catch { cp.textContent = 'Copia non riuscita'; }
      setTimeout(() => cp.textContent = 'Copia il testo', 1800);
    };
    const pr = document.createElement('button'); pr.type = 'button'; pr.textContent = 'Stampa';
    pr.onclick = () => window.print();
    act.append(cp, pr);
    wrap.append(h, o, box, act);
    outEl.append(wrap);
    if (window.matchMedia('(max-width:860px)').matches) wrap.scrollIntoView({behavior:'smooth', block:'start'});
  }

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    msgEl.textContent = '';
    let theme = themeEl.value === '__custom' ? customEl.value.trim() : themeEl.value;
    if (!theme) { msgEl.textContent = 'Scegli un tema per il racconto.'; return; }
    if (selected.size === 0) { msgEl.textContent = 'Seleziona almeno un personaggio.'; return; }

    const body = {
      theme,
      character_ids: [...selected],
      details: detailsEl.value.trim() || null
    };

    goEl.disabled = true; goEl.textContent = 'Scrittura in corso…';
    outEl.innerHTML = '<div class="empty"><div>La penna scorre sulla pergamena…<br><span class="ink"><i></i><i></i><i></i></span></div></div>';

    try {
      const r = await fetch('/api/stories/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      let data = null;
      try { data = await r.json(); } catch {}
      if (!r.ok) throw new Error(errText(data, r.status));
      if (!data || !data.story) throw new Error('Risposta del server non valida.');
      showStory(data.story);
    } catch (e) {
      msgEl.textContent = 'Il racconto non ha preso forma: ' + e.message;
      outEl.replaceChildren();
      if (lastStory) showStory(lastStory);
      else outEl.innerHTML = '<div class="empty"><div><span class="big">❧</span>Qualcosa è andato storto.<br>Prova a scrivere di nuovo.</div></div>';
    } finally {
      goEl.disabled = false; goEl.textContent = 'Scrivi la storia';
    }
  });

  loadChars();
})();
</script>
</body>
</html>
